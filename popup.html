<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SuperChrome</title>
    <style>
      * { box-sizing: border-box; }
      html.tab-mode { background: #141414; height: 100%; }
      body.tab-mode {
        width: auto;
        background: #141414;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 8vh 16px 24px;
        min-height: 100%;
      }
      .panel { background: #1a1a1c; }
      .tab-mode .panel {
        width: min(720px, 100%);
        border: 1px solid #ffffff14;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 16px 48px #00000088;
      }
      .tab-mode .list { height: 62vh; max-height: none; }
      html, body { margin: 0; }
      body {
        width: 560px;
        background: #1a1a1c;
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #ccccccdd;
      }
      .input-row {
        display: flex; align-items: center; position: relative;
        border-bottom: 1px solid #ffffff10;
        transition: border-bottom-color 0.25s;
      }
      .input-row > * { position: relative; }
      .input-row::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg, var(--mode-tint, transparent), transparent);
        opacity: 0; transition: opacity 0.25s;
      }
      .input-row[class*=" mode-"]::before { opacity: 1; }
      .input-row.mode-commands { --mode-tint: rgba(76, 157, 243, 0.22); border-bottom-color: rgba(76, 157, 243, 0.35); }
      .input-row.mode-tabs { --mode-tint: rgba(58, 181, 198, 0.22); border-bottom-color: rgba(58, 181, 198, 0.35); }
      .input-row.mode-history { --mode-tint: rgba(154, 110, 232, 0.22); border-bottom-color: rgba(154, 110, 232, 0.35); }
      .input-row.mode-emoji { --mode-tint: rgba(76, 175, 125, 0.22); border-bottom-color: rgba(76, 175, 125, 0.35); }
      .input-row.mode-downloads { --mode-tint: rgba(154, 110, 232, 0.22); border-bottom-color: rgba(154, 110, 232, 0.35); }
      @keyframes glyph-in {
        from { opacity: 0; transform: translateX(-4px); }
        to { opacity: 1; transform: none; }
      }
      .mode-glyph {
        display: none; padding-left: 14px;
        font-size: 15px; font-weight: 700; line-height: 1;
      }
      [class*=" mode-"] > .mode-glyph { display: block; animation: glyph-in 0.18s ease-out; }
      .mode-commands .mode-glyph { color: #4c9df3; }
      .mode-tabs .mode-glyph { color: #3ab5c6; }
      .mode-history .mode-glyph { color: #9a6ee8; }
      .mode-emoji .mode-glyph { color: #4caf7d; }
      .mode-downloads .mode-glyph { color: #9a6ee8; }
      .mode-commands .input, .mode-tabs .input, .mode-history .input,
      .mode-emoji .input, .mode-downloads .input { padding-left: 6px; }
      .kbd.chip-commands.active { background: linear-gradient(135deg, #4cd5f3, #4c65f3); color: #ffffff; }
      .kbd.chip-tabs.active { background: linear-gradient(135deg, #3ac6a8, #3a86c6); color: #ffffff; }
      .kbd.chip-history.active { background: linear-gradient(135deg, #716ee8, #c36ee8); color: #ffffff; }
      .kbd.chip-emoji.active { background: linear-gradient(135deg, #4caf5c, #4caf9e); color: #ffffff; }
      .kbd.chip-downloads.active { background: linear-gradient(135deg, #716ee8, #c36ee8); color: #ffffff; }
      .input {
        flex: 1; min-width: 0;
        background: transparent; border: none; outline: none;
        padding: 13px 14px; color: #e8e8e8;
        font-size: 15px; font-family: inherit;
      }
      .input::placeholder { color: #ffffff40; }
      .hint { display: flex; margin-right: 12px; flex-shrink: 0; align-items: center; }
      .hint .kbd {
        margin-right: 6px; max-width: 100px; overflow: hidden; white-space: nowrap;
        transition: max-width 0.25s ease, opacity 0.2s, padding 0.25s ease, margin-right 0.25s ease;
      }
      .input-row[class*=" mode-"] .hint .kbd:not(.active) {
        max-width: 0; opacity: 0; padding-left: 0; padding-right: 0; margin-right: 0;
      }
      @media (prefers-reduced-motion: reduce) { .hint .kbd, .input-row, .input-row::before { transition: none !important; } .mode-glyph { animation: none !important; } }
      #gear {
        display: flex; align-items: center; justify-content: center;
        width: 24px; height: 24px; padding: 0;
        background: none; border: none; border-radius: 6px;
        color: #cccccc80; cursor: pointer;
      }
      #gear:hover { background: #ffffff14; color: #e8e8e8; }
      .kbd {
        background: #ffffff14; color: #cccccc99;
        border-radius: 4px; padding: 2px 7px; font-size: 11px;
      }
      .list { max-height: 420px; overflow-y: auto; padding: 8px; position: relative; }
      .selector {
        position: absolute; left: 8px; right: 8px; top: 0; height: 38px;
        border-radius: 8px;
        background: #ffffff1a;
        transition: transform 0.1s ease, height 0.1s ease;
        pointer-events: none;
        will-change: transform;
        opacity: 0;
      }
      .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 2px; }
      .emoji-cell {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; height: 58px; padding: 4px; border-radius: 8px; cursor: pointer;
        min-width: 0;
      }
      .emoji-cell .glyph { font-size: 22px; line-height: 1; }
      .emoji-cell .emoji-name {
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: 9px; color: #ffffff59;
      }
      .emoji-cell.selected, .emoji-cell:hover { background: #ffffff1a; }
      .group-label {
        font-size: 11px; font-weight: 600;
        color: #ffffff59; padding: 8px 8px 4px;
      }
      .item {
        display: flex; align-items: center; gap: 10px;
        height: 38px; padding: 0 10px; border-radius: 8px; cursor: pointer;
        white-space: nowrap;
        position: relative; z-index: 1;
      }
      .item .icon {
        display: flex; align-items: center; justify-content: center;
        width: 24px; height: 24px; border-radius: 6px;
        background: #ffffff10; flex-shrink: 0;
      }
      .item .icon img { width: 18px; height: 18px; border-radius: 4px; }
      .item .icon.plain { background: transparent; }
      .fav-bar { display: flex; gap: 6px; padding: 10px 12px 4px; overflow: hidden; }
      .fav-item {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        width: 56px; flex: none;
      }
      .fav-tile {
        width: 40px; height: 40px; border-radius: 10px;
        background: #ffffff10; color: #ffffff;
        display: flex; align-items: center; justify-content: center;
      }
      .fav-tile.kind-folder { background: var(--sc-folder, linear-gradient(135deg, #e06f3c, #e0dd3c)); }
      .fav-item:hover .fav-tile, .fav-item.selected .fav-tile { outline: 2px solid rgba(255, 255, 255, 0.35); }
      .fav-tile img { width: 24px; height: 24px; border-radius: 5px; }
      .fav-tile svg { width: 20px; height: 20px; }
      .fav-cap {
        max-width: 54px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: 9px; color: #ffffff59;
      }
      .item .icon.kind-command { background: var(--sc-command, linear-gradient(135deg, #4cd5f3, #4c65f3)); color: #ffffff; }
      .item .icon.kind-folder { background: var(--sc-folder, linear-gradient(135deg, #e06f3c, #e0dd3c)); color: #ffffff; }
      .item .icon.kind-history { background: var(--sc-history, linear-gradient(135deg, #716ee8, #c36ee8)); color: #ffffff; }
      .item .icon.kind-bookmark, .item .icon.kind-tab, .item .icon.kind-closed {
        background: var(--sc-fallback, linear-gradient(135deg, #e05d89, #e0895d)); color: #ffffff;
      }
      .item .icon.kind-download { background: linear-gradient(135deg, #3aa97a, #3a8ea9); color: #ffffff; }
      .group-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      .item .icon.kind-calc { background: linear-gradient(135deg, #4caf5c, #4caf9e); color: #ffffff; font-weight: 700; font-size: 14px; }
      .item .icon.emoji-glyph { font-size: 17px; }
      .item .title {
        overflow: hidden; text-overflow: ellipsis;
        flex-shrink: 0; max-width: 55%;
        color: #e8e8e8; font-weight: 500;
      }
      .item .detail {
        flex: 1; overflow: hidden; text-overflow: ellipsis;
        color: #ffffff4d; font-size: 13px;
      }
      .item .type { flex-shrink: 0; margin-left: auto; color: #ffffff4d; font-size: 12px; }
      .item .title b { color: #ffffff; font-weight: 700; }
      .empty { padding: 16px; color: #ffffff59; }
      .actions {
        position: fixed; right: 10px; bottom: 10px;
        min-width: 220px;
        background: #232326;
        border: 1px solid #ffffff24; border-radius: 10px; padding: 4px;
        box-shadow: 0 8px 24px #00000088;
        z-index: 10;
      }
      .action-row {
        display: flex; align-items: center; gap: 10px;
        height: 30px; padding: 0 10px; border-radius: 6px; cursor: pointer;
        color: #e0e0e0; white-space: nowrap;
      }
      .action-row .spacer { flex: 1; min-width: 16px; }
      .action-row.selected { background: #ffffff24; }
      .action-row.danger { color: #ff8f8f; }
      @media (prefers-reduced-motion: reduce) { .selector { transition: none !important; } }
      .no-motion .selector { transition: none !important; }
      .ptoast {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px;
        background: #2a2a2c; border: 1px solid #ffffff24; border-radius: 10px;
        padding: 8px 14px; font-size: 13px; color: #e8e8e8; z-index: 50;
        box-shadow: 0 8px 24px #00000088;
      }
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-thumb { background: #ffffff1a; border-radius: 5px; }
    </style>
  </head>
  <body>
    <div class="panel">
    <div class="input-row">
      <span class="mode-glyph" id="modeGlyph"></span><input id="input" class="input" autofocus placeholder="Search bookmarks and commands…" spellcheck="false" autocomplete="off" />
      <div class="hint"><span class="kbd chip-commands">&gt; Commands</span><span class="kbd chip-tabs">@ Tabs</span><span class="kbd chip-history"># History</span><span class="kbd chip-emoji">: Emoji</span><span class="kbd chip-downloads">~ Files</span><button id="gear" title="SuperChrome Settings"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor"/><path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2" stroke="currentColor" stroke-linecap="round"/></svg></button></div>
    </div>
    <div id="list" class="list"></div>
    </div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
